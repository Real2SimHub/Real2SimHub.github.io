<style>
/* The home page's "Open-Source Resources": Real2SimLab on the left, Awesome-Real2Sim on the right. Each point has
   the icon it has on the project's page (scripts/build.py ICONS), on a tile in the project's colours. */
#title { top: 92px; font-size: 66px; }
.tags { position: absolute; left: 0; right: 0; top: 196px; display: flex; justify-content: center; gap: 30px; }
.tag { display: flex; align-items: center; gap: 16px; padding: 12px 34px 14px 20px; border-radius: 999px; font-size: 42px; font-weight: 700; color: #f5f3ff;
  background: rgba(124, 58, 237, .2); box-shadow: inset 0 0 0 2px rgba(167, 139, 250, .55), 0 12px 32px rgba(0, 0, 0, .35); }
.tag svg { width: 50px; height: 50px; }
.tag.open svg { color: #86efac; }
.tag.easy svg { color: #fcd34d; }
.pc { position: absolute; top: 330px; width: 820px; height: 670px; border-radius: 30px; padding: 52px 0 0;
  background: linear-gradient(180deg, rgba(30, 41, 82, .9), rgba(18, 26, 51, .95)); box-shadow: 0 0 0 2px #2f3d6e, 0 30px 70px rgba(0,0,0,.5); }
.pc img { height: 196px; width: auto; display: block; margin: 0 auto 46px; }
.pts { list-style: none; margin: 0 auto; padding: 0; width: fit-content; display: grid; gap: 26px; }
.pts li { display: flex; align-items: center; gap: 28px; font-size: 44px; font-weight: 700; color: #e2e8f0; white-space: nowrap; }
.ico { flex: none; width: 82px; height: 82px; border-radius: 22px; display: grid; place-items: center; color: #fff; box-shadow: 0 10px 26px rgba(0, 0, 0, .35); }
.ico svg { width: 46px; height: 46px; }
.lab .ico { background: linear-gradient(135deg, #7c3aed, #2563eb 55%, #0891b2); }
.awe .ico { background: linear-gradient(135deg, #c026d3, #e11d48 55%, #ea580c); }
</style></head>
