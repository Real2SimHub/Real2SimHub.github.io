<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Fair comparison</title>
<link rel="stylesheet" href="common.css">
<script src="../build/clips/clips.js"></script>
<style>
#steps { position: absolute; top: 230px; left: 85px; display: flex; gap: 25px; }
.st { width: 330px; height: 330px; border-radius: 28px; background: #121a33; box-shadow: 0 0 0 2px #2a3866; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.st img { width: 120px; height: 120px; border-radius: 26px; }
.st b { font-size: 54px; line-height: 1.1; }
.st span { font-size: 44px; color: var(--muted); line-height: 1.1; }
#track { position: absolute; top: 612px; left: 250px; width: 1420px; height: 8px; border-radius: 4px; background: #24305a; }
#fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2563eb, #7c3aed); }
.dot { position: absolute; top: 600px; width: 32px; height: 32px; margin-left: -16px; border-radius: 50%; background: #24305a; box-shadow: 0 0 0 6px #0b1020; }
#lock { position: absolute; top: 676px; left: 0; right: 0; display: flex; justify-content: center; }
</style></head>
<body><div class="stage">
  <div class="beat" data-in="0.1" data-fx="down"><img class="lg" src="../../assets/brand/svg/real2simlab-logo-dark.svg" alt="Real2SimLab"><span class="sep"></span><span class="num">2</span><span>Fair comparison</span></div>
  <div id="steps">
    <div class="st"><img src="../assets/icons/step-build.svg" alt=""><b>Build</b><span>same sandbox</span></div>
    <div class="st"><img src="../assets/icons/step-freeze.svg" alt=""><b>Freeze</b><span>fingerprinted</span></div>
    <div class="st"><img src="../assets/icons/step-rerun.svg" alt=""><b>Re-run</b><span>offline</span></div>
    <div class="st"><img src="../assets/icons/step-score.svg" alt=""><b>Score</b><span>its own scorer</span></div>
    <div class="st"><img src="../assets/icons/step-report.svg" alt=""><b>Report</b><span>one scorecard</span></div>
  </div>
  <div id="track"><div id="fill"></div></div>
  <div class="dot" style="left:250px"></div><div class="dot" style="left:605px"></div><div class="dot" style="left:960px"></div><div class="dot" style="left:1315px"></div><div class="dot" style="left:1670px"></div>

  <div class="center say" style="top:780px" data-in="0.5" data-out="3.5">Every method runs in the same sandbox.</div>
  <div class="center say" style="top:780px" data-in="3.7" data-out="7.4">Its program is frozen and re-run offline,<br>without the answers.</div>
  <div class="center say" style="top:780px" data-in="7.6">Each benchmark scores it<br>with its own scorer.</div>
</div>
<script>
window.DURATION = 10.6;
const ON = [0.7, 3.9, 5.0, 7.8, 9.0];   // when each step lights up
window.scene = (t) => {
  document.querySelectorAll(".st").forEach((e, i) => {
    const appear = ease.out(ramp(t, 0.2 + i * 0.08, 0.7 + i * 0.08));
    const lit = ease.out(ramp(t, ON[i], ON[i] + 0.5));
    e.style.opacity = (appear * lerp(0.38, 1, lit)).toFixed(3);
    e.style.transform = `translateY(${(1 - appear) * 30}px) scale(${lerp(0.97, 1, lit) + 0.04 * env(t, ON[i], ON[i] + 1.0, 0.3)})`;
    e.style.boxShadow = lit > 0.01
      ? `0 0 0 3px rgba(129,140,248,${lit.toFixed(3)}), 0 0 ${60 * lit}px rgba(99,102,241,${(0.45 * lit).toFixed(3)})`
      : "0 0 0 2px #2a3866";
  });
  document.querySelectorAll(".dot").forEach((d, i) => {
    const lit = ramp(t, ON[i], ON[i] + 0.3);
    d.style.background = lit > 0.5 ? "#818cf8" : "#24305a";
  });
  // The track fills from step to step.
  let f = 0;
  for (let i = 1; i < ON.length; i++) f += 0.25 * ease.inOut(ramp(t, ON[i] - 0.5, ON[i]));
  document.getElementById("fill").style.width = (f * 100).toFixed(2) + "%";
  document.getElementById("track").style.opacity = ramp(t, 0.4, 0.9).toFixed(3);
  document.querySelectorAll(".dot").forEach((d) => (d.style.opacity = ramp(t, 0.4, 0.9).toFixed(3)));
};
</script>
<script src="common.js"></script>
</body></html>
