<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Opening</title>
<link rel="stylesheet" href="common.css">
<script src="../build/clips/clips.js"></script>
<style>
/* The opening: a wall of real recordings turns into building blocks ("Real to simulation"), the phrase folds into
   the R∞S logo, and the wall stays behind the title as a dim violet texture. */
/* A wall of 25 real recordings (video/real_clips.json); a sweep turns each one into building blocks. */
#wall { position: absolute; inset: 0; }
.tile { position: absolute; width: 384px; height: 216px; overflow: hidden; background: #000; }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.blocks { position: absolute; inset: 0; }
.blocks img { image-rendering: pixelated; filter: saturate(1.35) contrast(1.06); }
/* One 12 px block per pixel of the 32x18 frame: a bevel and a stud on each. */
.blocks::after { content: ""; position: absolute; inset: 0; background-size: 12px 12px; background-image:
  radial-gradient(circle at 4.7px 4.7px, rgba(255,255,255,.55) 0 1px, transparent 1.7px),
  radial-gradient(circle at 6px 6px, rgba(255,255,255,.20) 0 3px, rgba(0,0,0,.30) 3.3px 4.3px, transparent 4.7px),
  linear-gradient(90deg, rgba(255,255,255,.18) 0 1px, transparent 1px 11px, rgba(0,0,0,.34) 11px 12px),
  linear-gradient(180deg, rgba(255,255,255,.18) 0 1px, transparent 1px 11px, rgba(0,0,0,.34) 11px 12px); }
#lines { position: absolute; inset: 0; pointer-events: none; background-image:
  linear-gradient(90deg, var(--bg) 0 4px, transparent 4px), linear-gradient(180deg, var(--bg) 0 4px, transparent 4px);
  background-size: 384px 100%, 100% 216px; background-position: -2px 0, 0 -2px; }
#sweep { position: absolute; left: 0; top: -160px; width: 16px; height: 1400px; margin-left: -8px; border-radius: 8px;
  background: linear-gradient(180deg, transparent, #ede9fe 18%, #ede9fe 82%, transparent);
  box-shadow: 0 0 34px 12px rgba(167, 139, 250, .75), 0 0 120px 40px rgba(124, 58, 237, .38); }
#plate { position: absolute; left: 0; right: 0; top: 0; height: 1080px; display: flex; align-items: center; justify-content: center; }
.plate { display: flex; align-items: baseline; padding: 6px 64px 26px; border-radius: 40px; white-space: nowrap;
  background: rgba(22, 12, 52, .72); backdrop-filter: blur(14px); box-shadow: 0 30px 90px rgba(0, 0, 0, .55), 0 0 0 2px rgba(255, 255, 255, .08);
  font-size: 150px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
#w1 { color: #f5f3ff; }
#w2 { display: inline-block; overflow: hidden; }
#w2 span { display: inline-block; padding-left: .28em; background: linear-gradient(90deg, #c4b5fd, #9469fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
#wallbox { position: absolute; inset: 0; transform-origin: 50% 50%; }
#tint { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(1100px 760px at 50% 26%, rgba(76, 29, 149, .55), transparent 70%), linear-gradient(180deg, rgba(14, 8, 38, .88), rgba(11, 16, 32, .94)); }
#veil { position: absolute; inset: 0; pointer-events: none; background: rgba(46, 16, 101, .16); }
#logo { position: absolute; left: 50%; top: 92px; height: 360px; width: 688.8px; margin-left: -344.4px; overflow: visible; filter: drop-shadow(0 18px 50px rgba(124,58,237,.5)); }
#line { top: 514px; padding: 0 260px; }
#lab { position: absolute; right: 64px; top: 48px; display: flex; align-items: center; gap: 18px; font-size: 38px; font-weight: 700; color: var(--soft); }
#lab img { width: 70px; height: 70px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
#from { top: 690px; font-size: 34px; font-weight: 600; color: var(--muted); }
.orgs { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; }
.org { display: flex; align-items: center; gap: 16px; height: 100px; padding: 0 32px 0 12px; border-radius: 22px; background: #fff; color: #1e293b; font-size: 40px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 14px 40px rgba(0, 0, 0, .35); }
.org img { width: 76px; height: 76px; object-fit: contain; border-radius: 12px; }
.org.wide { padding: 0 30px; }
.org.wide img { width: 206px; height: 56px; border-radius: 0; }
</style></head>

><path class="own" fill="#a78bfa" d="M684.12 1.2Q678.18 1.2 673.26 -1.23Q670.67 -2.51 668.58 -4.28V0H650.52V-87.12H668.88V-54.55Q670.88 -56.11 673.32 -57.24Q678.24 -59.52 684.12 -59.52Q692.4 -59.52 698.82 -55.56Q705.24 -51.6 708.9 -44.73Q712.56 -37.86 712.56 -29.1Q712.56 -20.4 708.9 -13.56Q705.24 -6.72 698.82 -2.76Q692.4 1.2 684.12 1.2ZM503.22 0V-84.72H522.12V-51.66H555.72V-84.72H574.62V0H555.72V-35.4H522.12V0ZM613.38 1.32Q605.42 1.32 599.23 -1.98Q593.04 -5.28 589.53 -11.12Q586.02 -16.96 586.02 -24.53V-58.32H604.38V-24.72Q604.38 -21.71 605.45 -19.54Q606.52 -17.36 608.57 -16.18Q610.62 -15 613.4 -15Q617.52 -15 619.92 -17.58Q622.32 -20.17 622.32 -24.72V-58.32H640.68V-24.54Q640.68 -16.86 637.2 -11.04Q633.72 -5.22 627.57 -1.95Q621.43 1.32 613.38 1.32ZM680.88 -15.36Q684.72 -15.36 687.66 -17.13Q690.6 -18.9 692.28 -22.02Q693.96 -25.14 693.96 -29.16Q693.96 -33.18 692.28 -36.3Q690.6 -39.42 687.63 -41.19Q684.66 -42.96 680.82 -42.96Q676.98 -42.96 674.01 -41.19Q671.04 -39.42 669.42 -36.33Q667.8 -33.24 667.8 -29.16Q667.8 -25.08 669.45 -21.96Q671.1 -18.84 674.07 -17.1Q677.04 -15.36 680.88 -15.36Z"/></g></svg>

  <div class="center say" id="line" data-in="8.2" data-d="0.6">We invite you to build the infrastructure of real-to-simulation together.</div>
  <div class="center" id="from" data-in="10.0">Contributors come from:</div>
  <div class="orgs" id="o1" style="top:760px"></div>
  <div class="orgs" id="o2" style="top:888px"></div>
</div>
<script>
window.DURATION = 14.0;
// Rows of video/real_clips.json, left to right.
const NAMES = [
  "waves", "droid_bowl", "fill_glass", "crosswalk", "cat",
  "package", "clouds", "lit_candle", "horse", "strider",
  "coffee", "ducks", "rain", "reachy", "fire",
  "street", "balloon", "gull", "lab_arm", "domino",
  "teapot", "fountain", "droid_block", "snow", "basket",
];
const W = 384, H = 216, SLOPE = 0.36;
const wall = document.getElementById("wall"), sweep = document.getElementById("sweep");
const w2 = document.getElementById("w2"), w2in = w2.firstElementChild;
const tiles = NAMES.map((name, i) => {
  const col = i % 5, row = Math.floor(i / 5);
  const el = document.createElement("div");
  el.className = "tile";
  el.style.left = `${col * W}px`;
  el.style.top = `${row * H}px`;
  el.innerHTML = `<img data-clip="r_${name}" data-at="0" alt=""><div class="blocks"><img data-clip="b_${name}" data-at="0" alt=""></div>`;
  wall.appendChild(el);
  return { el, blocks: el.querySelector(".blocks"), x: col * W, y: row * H, d: Math.hypot(col - 2, row - 2) };
});
// The institutions of the contributors (data/site.json "orgs"), standing still, by their short names.
const ORGS = "../../assets/img/orgs/";
const ROWS = [
  [["peking-university.png", "PKU"], ["ngoro-robotics.svg", ""], ["tsinghua-university.png", "THU"],
   ["the-university-of-hong-kong.png", "HKU"], ["national-university-of-singapore.png", "NUS"],
   ["shanghai-jiao-tong-university.png", "SJTU"], ["agibot.png", "AgiBot"]],
  [["university-of-rochester.png", "URochester"], ["uc-san-diego.png", "UCSD"], ["bigai.png", "BIGAI"],
   ["hkust-guangzhou.png", "HKUST (GZ)"], ["southeast-university.png", "SEU"], ["uestc-ai-club.png", "UESTC AI Club"]],
];
const orgEls = [];
ROWS.forEach((row, r) => {
  const box = document.getElementById(`o${r + 1}`);
  box.innerHTML = row.map(([img, abbr]) => abbr
    ? `<div class="org"><img src="${ORGS}${img}" alt="">${abbr}</div>`
    : `<div class="org wide"><img src="${ORGS}${img}" alt="Ngoro Robotics"></div>`).join("");
  orgEls.push(...box.children);
});
// Both rows the same scale, small enough for the wider one to fit the frame (1800 px of 1920):
// measured once the fonts are ready, as the labels set the tiles' widths.
function fitRows() {
  const boxes = ROWS.map((_, r) => document.getElementById(`o${r + 1}`));
  const width = (box) => [...box.children].reduce((w, e) => w + e.offsetWidth, 0)
    + parseFloat(getComputedStyle(box).columnGap) * (box.children.length - 1);
  const s = Math.min(1, 1800 / Math.max(...boxes.map(width)));
  boxes.forEach((box) => { box.style.transformOrigin = "50% 0"; box.style.transform = `scale(${s})`; });
}
// The sweep is the line X + SLOPE * (Y - 540) = s; everything left of it is blocks.
const sweepAt = (t) => lerp(-560, 2480, ease.inOut(ramp(t, 2.3, 4.4)));
const FOLD = [6.1, 7.0];          // the phrase folds into the logo
const LOGO_AT = 6.55;             // the ribbon starts to draw
let full = 0;
window.setup = () => { full = w2in.getBoundingClientRect().width; fitRows(); };
window.scene = (t) => {
  const s = sweepAt(t);
  tiles.forEach((tile) => {
    const k = ease.out(ramp(t, 0.05 + 0.1 * tile.d, 0.5 + 0.1 * tile.d));
    const a = s - SLOPE * (tile.y - 540) - tile.x, b = s - SLOPE * (tile.y + H - 540) - tile.x;
    const ca = Math.max(0, Math.min(W, a)), cb = Math.max(0, Math.min(W, b));
    tile.blocks.style.clipPath = `polygon(0 0, ${ca}px 0, ${cb}px ${H}px, 0 ${H}px)`;
    tile.blocks.style.visibility = Math.max(ca, cb) > 0 ? "visible" : "hidden";
    const near = (tile.x + W / 2 + SLOPE * (tile.y + H / 2 - 540)) - s;
    const flash = t > 2.3 && t < 4.6 ? Math.exp(-Math.pow(near / 170, 2)) : 0;
    tile.el.style.opacity = k.toFixed(4);
    tile.el.style.transform = `scale(${(lerp(0.84, 1, k) * (1 - 0.035 * flash)).toFixed(4)})`;
    tile.el.style.filter = flash > 0.01 ? `brightness(${(1 + 0.45 * flash).toFixed(3)})` : "";
  });
  sweep.style.transform = `translateX(${s}px) rotate(${Math.atan(SLOPE)}rad)`;
  sweep.style.opacity = (ramp(t, 2.3, 2.6) * (1 - ramp(t, 4.1, 4.4))).toFixed(3);
  // "Real", then "to simulation" as the sweep passes.
  const plate = document.getElementById("plate");
  const pin = ease.back(ramp(t, 0.8, 1.35)), fold = ease.inOut(ramp(t, FOLD[0], FOLD[1]));
  const g = ease.inOut(ramp(t, 3.0, 3.8));
  w2.style.width = `${(g * full).toFixed(1)}px`;
  w2.style.opacity = ease.out(ramp(t, 3.1, 3.8)).toFixed(3);
  // The phrase folds up into the centre of the ribbon (y = 208) while the ribbon draws.
  plate.style.opacity = (ease.out(ramp(t, 0.8, 1.25)) * (1 - ramp(t, FOLD[0] + 0.35, FOLD[1]))).toFixed(3);
  plate.style.transform = `translateY(${(-332 * fold).toFixed(1)}px) scale(${(lerp(0.9, 1, pin) * lerp(1, 0.22, fold)).toFixed(4)})`;
  plate.style.visibility = t < FOLD[1] ? "visible" : "hidden";
  // The wall recedes into a dim violet texture behind the title.
  const back = ease.inOut(ramp(t, 5.9, 7.4));
  const wb = document.getElementById("wallbox");
  wb.style.transform = `scale(${(1 + 0.08 * back + 0.004 * Math.max(0, t - 7.4)).toFixed(4)})`;
  wb.style.filter = back > 0.001 ? `blur(${(5 * back).toFixed(2)}px) saturate(${(1 - 0.5 * back).toFixed(3)})` : "";
  document.getElementById("tint").style.opacity = (0.88 * back).toFixed(3);
  logoReveal(t, LOGO_AT);
  document.getElementById("logo").style.visibility = t >= LOGO_AT ? "visible" : "hidden";
  orgEls.forEach((e, i) => {
    const k = ease.back(ramp(t, 10.2 + i * 0.11, 10.7 + i * 0.11));
    e.style.opacity = ramp(t, 10.2 + i * 0.11, 10.5 + i * 0.11).toFixed(3);
    e.style.transform = `translateY(${((1 - k) * 26).toFixed(1)}px)`;
  });
};
</script>
